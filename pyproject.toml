[project]
name = "ocb24"
version = "0.1.0"
description = "Тестовое задание ОСЬ"
readme = "README.md"
authors = [{ name = "Danila Schelkov", email = "me@donutquine.dev" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
]

[project.scripts]
api = "api.__main__:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[dependency-groups]
dev = [
    "isort>=9.0.2",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]
